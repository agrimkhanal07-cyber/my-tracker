<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Tracker Pro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #1a73e8; font-size: 24px; margin-bottom: 10px; }
        p { color: #5f6368; font-size: 14px; }
        .session-box { background: #f8f9fa; border: 1px solid #dadce0; padding: 15px; border-radius: 8px; margin: 20px 0; word-break: break-all; font-family: monospace; color: #d93025; font-weight: bold; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; color: white; text-decoration: none; box-sizing: border-box; }
        .btn-1 { background: #1a73e8; }
        .btn-2 { background: #34a853; }
        .btn-3 { background: #ea4335; }
        .btn:hover { opacity: 0.9; }
        #log-status { margin-top: 15px; font-size: 12px; color: #137333; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome!</h1>
        <p>Your Unique Session ID is:</p>
        <div class="session-box" id="session-id">Generating ID...</div>

        <button class="btn btn-1 trackable-btn" data-action="Clicked Special Offer">Click Me: Special Offer</button>
        <button class="btn btn-2 trackable-btn" data-action="Clicked Download Guide">Download Free Guide</button>
        <button class="btn btn-3 trackable-btn" data-action="Clicked Contact Support">Contact Support</button>
        
        <div id="log-status"></div>
    </div>

    <script>
        function generateSessionId() {
            let sid = localStorage.getItem('visitor_session_id');
            if (!sid) {
                sid = 'sid_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('visitor_session_id', sid);
            }
            return sid;
        }

        const currentSessionId = generateSessionId();
        document.getElementById('session-id').innerText = currentSessionId;

        const visitData = {
            sessionId: currentSessionId,
            time: new Date().toLocaleString(),
            userAgent: navigator.userAgent
        };
        
        let allVisits = JSON.parse(localStorage.getItem('all_visits') || '[]');
        if (!allVisits.some(v => v.sessionId === currentSessionId)) {
            allVisits.push(visitData);
            localStorage.setItem('all_visits', JSON.stringify(allVisits));
        }

        document.querySelectorAll('.trackable-btn').forEach(button => {
            button.addEventListener('click', function() {
                const actionName = this.getAttribute('data-action');
                let allClicks = JSON.parse(localStorage.getItem('all_clicks') || '[]');
                allClicks.push({
                    sessionId: currentSessionId,
                    action: actionName,
                    time: new Date().toLocaleString()
                });
                localStorage.setItem('all_clicks', JSON.stringify(allClicks));
                
                document.getElementById('log-status').innerText = "✓ Action recorded for your Session ID!";
            });
        });
    </script>
</body>
</html>
