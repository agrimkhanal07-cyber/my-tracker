<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tracker Website</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        h1 { color: #0066cc; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 15px 0; font-size: 14px; text-align: center; border: 1px solid #ccc; border-radius: 6px; background: #fafafa; }
        button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 6px; font-size: 15px; color: white; cursor: pointer; font-weight: bold; }
        .btn-1 { background-color: #0066cc; }
        .btn-2 { background-color: #28a745; }
        .btn-3 { background-color: #dc3545; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome!</h1>
        <p>Your Unique Session ID is:</p>
        <input type="text" id="sessionId" readonly>
        
        <button class="btn-1" onclick="trackClick('Special Offer Clicked')">Click Me: Special Offer</button>
        <button class="btn-2" onclick="trackClick('Download Guide Clicked')">Download Free Guide</button>
        <button class="btn-3" onclick="trackClick('Contact Support Clicked')">Contact Support</button>
    </div>

    <!-- Hidden Form for Data Collection -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    <form id="trackerForm" action="https://docs.google.com/forms/d/e/1FAIpQLSdFIDVpLa65SaoK77m7cbuV5JD7AMgi2Wcdc6urfLdMN4hwPg/formResponse" method="POST" target="hidden_iframe" style="display:none;">
        <input type="text" name="entry.1438914619" id="formEntryData">
    </form>

    <script>
        // Session ID Logic
        let sessionId = localStorage.getItem('session_id');
        if (!sessionId) {
            sessionId = 'sid_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('session_id', sessionId);
        }
        document.getElementById('sessionId').value = sessionId;

        // Send Visit Log Automatically
        sendDataToGoogleSheet("New Visit | Session ID: " + sessionId);

        // Click Tracking Logic
        function trackClick(actionName) {
            let logDetails = "Action: " + actionName + " | Session ID: " + sessionId;
            sendDataToGoogleSheet(logDetails);
            alert("Action recorded successfully!");
        }

        // Function to submit data to Google Form seamlessly
        function sendDataToGoogleSheet(dataString) {
            document.getElementById('formEntryData').value = dataString;
            document.getElementById('trackerForm').submit();
        }
    </script>

</body>
</html>
